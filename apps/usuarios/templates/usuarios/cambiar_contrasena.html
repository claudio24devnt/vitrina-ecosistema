{% extends "base.html" %}

{% block titulo %}Mi contraseña — TivoScanea{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
        <h1 class="h3 mb-3">Cambiar mi contraseña</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "_campos_formulario.html" %}
                    <button type="submit" class="btn btn-success">Guardar contraseña</button>
                    <a href="{% url 'inicio' %}" class="btn btn-link text-secondary">Volver</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
