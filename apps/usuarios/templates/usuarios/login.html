{% extends "base.html" %}

{% block titulo %}Ingresar — TivoScanea{% endblock %}

{% block contenido %}
<div class="row justify-content-center mt-5">
    <div class="col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 text-success fw-bold mb-1">TivoScanea</h1>
                <p class="text-secondary mb-4">Ingresa con tu correo y contraseña.</p>

                {% if form.errors %}
                    <div class="alert alert-danger">El correo o la contraseña no son correctos.</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Correo</label>
                        <input type="email" name="username" id="id_username" class="form-control form-control-lg"
                               value="{{ form.username.value|default_if_none:'' }}" autocomplete="username" autofocus required>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <input type="password" name="password" id="id_password" class="form-control form-control-lg"
                               autocomplete="current-password" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-success btn-lg w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
