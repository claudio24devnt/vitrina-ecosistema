{% extends "base.html" %}

{% block titulo %}Vender — TivoScanea{% endblock %}

{% block contenido %}
<div class="encabezado-seccion">
    <h1>Nueva venta</h1>
    <a href="{% url 'ventas:lista_ventas' %}" class="boton boton-secundario">Ver ventas del día</a>
</div>

<div class="tarjeta">
    <div class="campo">
        <label for="input-codigo">Escaneá cada producto (o escribí el código y presioná Enter)</label>
        <input type="text" id="input-codigo" class="escaneo-input" autocomplete="off" autofocus
               data-url-buscar="{% url 'inventario:buscar_por_codigo' %}">
    </div>
    <p id="aviso-escaneo" class="mensaje mensaje-warning" hidden></p>
</div>

<form method="post" id="form-venta" class="tarjeta">
    {% csrf_token %}
    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="carrito">
            <tr id="carrito-vacio"><td colspan="5">Todavía no escaneaste ningún producto.</td></tr>
        </tbody>
    </table>

    <p class="total-venta">Total: <strong id="total-venta">$0</strong></p>

    <div class="campo">
        <label for="medio-pago">Medio de pago</label>
        <select id="medio-pago" name="medio_pago" required>
            {% for valor, etiqueta in medios_pago %}
                <option value="{{ valor }}">{{ etiqueta }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="fila-acciones">
        <button type="submit" class="boton" id="boton-cobrar" disabled>Registrar venta</button>
        <button type="button" class="boton boton-secundario" id="boton-vaciar">Vaciar</button>
    </div>
</form>

<template id="plantilla-fila">
    <tr>
        <td data-etiqueta="Producto">
            <input type="hidden" name="id_producto">
            <span data-campo="nombre"></span>
            <div class="etiqueta-stock-bajo" data-campo="stock" hidden></div>
        </td>
        <td data-etiqueta="Precio" data-campo="precio"></td>
        <td data-etiqueta="Cantidad">
            <input type="number" name="cantidad" min="1" value="1" class="input-cantidad" required>
        </td>
        <td data-etiqueta="Subtotal" data-campo="subtotal"></td>
        <td data-etiqueta="">
            <button type="button" class="boton boton-peligro" data-accion="quitar">Quitar</button>
        </td>
    </tr>
</template>

<script src="/static/js/venta.js"></script>
{% endblock %}
