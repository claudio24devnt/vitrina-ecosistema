# Despliegue a Azure App Service (paquete 1.6). Corre sólo cuando el CI terminó
# en verde sobre main. Sin secretos: GitHub obtiene un token OIDC y Azure lo
# canjea por la identidad id-tivoscanea-github (infra/modulos/oidc.bicep), que
# sólo acepta tokens del entorno «produccion».
#
# Variables del entorno «produccion» en GitHub (no son secretos):
#   AZURE_CLIENT_ID        salida idClienteGithub del despliegue de infra
#   AZURE_TENANT_ID        id del tenant de Entra ID
#   AZURE_SUBSCRIPTION_ID  id de la suscripción
#   AZURE_WEBAPP_NAME      salida nombreApp del despliegue de infra
name: Despliegue

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write # para pedir el token OIDC

concurrency:
  group: despliegue-produccion
  cancel-in-progress: false # nunca cortar un despliegue a medias

jobs:
  desplegar:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produccion

    steps:
      - uses: actions/checkout@v4
        with:
          # El commit que pasó el CI, no lo último de main.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Empaquetar
        # App Service instala requirements.txt al recibir el paquete (Oryx).
        run: >-
          zip -r paquete.zip . -x '.git/*' '.github/*' 'infra/*' 'pruebas_carga/*'
          '*/__pycache__/*' '.env*' 'conftest.py' '*/test_*.py' '*/tests.py'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: paquete.zip
