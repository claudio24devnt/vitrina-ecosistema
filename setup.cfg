[flake8]
max-line-length = 95
extend-ignore = E203, W503
exclude = .venv,migrations,__pycache__

# §6: cobertura mínima de 80 % en servicios y modelos (la interfaz no cuenta).
# `python -m pytest --cov` la mide y falla si baja del mínimo.
[coverage:run]
include =
    apps/*/servicios.py
    apps/*/models.py
    apps/almacenes/aislamiento.py
    apps/almacenes/errores.py

[coverage:report]
fail_under = 80
show_missing = true
skip_covered = true
