{% if form.non_field_errors %}
    <div class="alert alert-danger">{% for error in form.non_field_errors %}{{ error }} {% endfor %}</div>
{% endif %}
{% for campo in form %}
    <div class="mb-3">
        <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}</label>
        {{ campo }}
        {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
        {% for error in campo.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
    </div>
{% endfor %}
